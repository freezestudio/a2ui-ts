name: Publish single package (manual fallback)

# 正常发布路径：合并 Changesets 生成的 Version Packages PR 后，
# release.yml 会自动按包发布并创建 tag。
# 本 workflow 仅在需要人工补发某个 workspace 包时使用。

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Workspace package name, e.g. @freezestudio/a2ui-sdk'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      - name: Run all tests
        run: pnpm -r test

      - name: Publish selected package
        run: pnpm --filter "${{ inputs.package }}" publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
