- name: test_accessibility_attributes_plumbing
  description: AccessibilityAttributes（label/description/live/hidden）属性应正确进入无障碍树
  catalog:
    version: '1.0'
  action: accessibility_check
  args:
    components:
      - id: root
        component: Column
        children: [btn1, status_text]
      - id: btn1
        component: Button
        title: 'Mute'
        accessibility:
          label: 'Mute Notifications'
          description: 'Silences notifications about this conversation'
      - id: status_text
        component: Text
        text: 'Status: Active'
        accessibility:
          live: 'polite'
  expect_accessibility:
    btn1:
      label: 'Mute Notifications'
      description: 'Silences notifications about this conversation'
    status_text:
      live: 'polite'
  expect_axe_rules:
    - button-name
    - aria-valid-attr-value
    - aria-allowed-attr

- name: test_accessibility_live_region_assertive
  description: assertive live region 应用于关键告警横幅更新
  catalog:
    version: '1.0'
  action: accessibility_check
  args:
    components:
      - id: root
        component: Column
        children: [alert_box]
      - id: alert_box
        component: Text
        text: 'Connection Lost!'
        accessibility:
          label: 'Critical Alert'
          live: 'assertive'
  expect_accessibility:
    alert_box:
      label: 'Critical Alert'
      live: 'assertive'
  expect_axe_rules:
    - aria-valid-attr-value

- name: test_accessibility_hidden_subtree
  description: hidden=true 时组件及其子树应从辅助技术隐藏（递归传播）
  catalog:
    version: '1.0'
  action: accessibility_check
  args:
    components:
      - id: root
        component: Column
        accessibility:
          hidden: true
        children: [visible_text, decorative_icon]
      - id: visible_text
        component: Text
        text: 'Visible Content'
      - id: decorative_icon
        component: Icon
        name: 'star'
  expect_accessibility:
    root:
      hidden: true
    visible_text:
      hidden: true
    decorative_icon:
      hidden: true
  expect_axe_rules:
    - aria-hidden-focus

- name: test_accessibility_implicit_label_inference
  description: 未显式声明 accessibility 时，从可见文本/标题推断可访问名称
  catalog:
    version: '1.0'
  action: accessibility_check
  args:
    components:
      - id: root
        component: Column
        children: [submit_btn]
      - id: submit_btn
        component: Button
        title: 'Submit Form'
  expect_accessibility:
    submit_btn:
      label: 'Submit Form'
  expect_axe_rules:
    - button-name
