# v1.0 增量流式解析套件（IncrementalStreamParser）
#
# 说明：本套件由 a2ui-ts 维护（上游 TypeScript 端尚未提供等价实现），
# 采用 v1.0 wire 格式（createSurface / updateComponents / updateDataModel），
# 并被 conformance/tests/sdk-behavior 中的功能用例实际执行（非仅格式校验）。
#
# 每个 step 的 `expect` 为本次 processChunk 产出的 a2ui_partial 摘要列表：
#   - components[].id / type / isPlaceholder
#   - dataModelDelta（出现时）
# 组件 props 与未声明的字段不参与断言。

- name: test_incremental_yield_after_root_closes
  description: 组件在 surface 可见（createSurface 闭合）后增量下发 reachable 子树。
  action: process_chunk
  steps:
    - input: '<a2ui-json>'
      expect: []
    - input: '{"version":"v1.0","createSurface":{"surfaceId":"s1","catalogId":"c1","components":['
      expect: []
    - input: '{"id":"root","component":"Column","children":["txt"]}'
      expect: []
    - input: ',{"id":"txt","component":"Text","text":"hi"}]}}'
      expect:
        - components:
            - { id: root, type: Column }
            - { id: txt, type: Text }
    - input: '</a2ui-json>'
      expect: []

- name: test_orphan_component_not_yielded
  description: 从 root 不可达的孤立组件不下发，但其被引用的 id 以 placeholder 补齐。
  action: process_chunk
  steps:
    - input: '<a2ui-json>{"version":"v1.0","createSurface":{"surfaceId":"s1","catalogId":"c1","components":['
      expect: []
    - input: '{"id":"root","component":"Column","children":["a"]}'
      expect: []
    - input: ',{"id":"orphan","component":"Text","text":"o"}]}}'
      expect:
        - components:
            - { id: root, type: Column }
            - { id: a, isPlaceholder: true }
    - input: '</a2ui-json>'
      expect: []

- name: test_forward_reference_placeholder
  description: 被引用但尚未开始的组件下发 placeholder（前向引用）。
  action: process_chunk
  steps:
    - input: '<a2ui-json>{"version":"v1.0","createSurface":{"surfaceId":"s1","catalogId":"c1","components":['
      expect: []
    - input: '{"id":"root","component":"Column","children":["later"]}'
      expect: []
    - input: ']}}'
      expect:
        - components:
            - { id: root, type: Column }
            - { id: later, isPlaceholder: true }
    - input: '</a2ui-json>'
      expect: []

- name: test_v1_0_late_catalog_id_buffered_until_closed
  description: >-
    v1.0 组件在 catalogId 晚到（在类型/属性之后）时，未闭合前不下发；
    闭合后一次性下发（避免按 surface catalog 误校验）。
  action: process_chunk
  steps:
    - input: '<a2ui-json>{"version":"v1.0","createSurface":{"surfaceId":"s1","catalogId":"basic"}},'
      expect: []
    - input: '{"version":"v1.0","updateComponents":{"surfaceId":"s1","components":[{"id":"root","component":"Column","children":["m1"]},{"id":"m1","component":"CustomMetric","value":42'
      expect:
        - components:
            - { id: root, type: Column }
    - input: ',"catalogId":"custom"}'
      expect:
        - components:
            - { id: m1, type: CustomMetric }
    - input: ']}}'
      expect: []
    - input: '</a2ui-json>'
      expect: []

- name: test_data_model_delta_emitted
  description: updateDataModel 消息下发时携带 dataModelDelta。
  action: process_chunk
  steps:
    - input: '<a2ui-json>{"version":"v1.0","createSurface":{"surfaceId":"s1","catalogId":"c1","components":[{"id":"root","component":"Column","children":[]}]}}'
      expect:
        - components:
            - { id: root, type: Column }
    - input: '</a2ui-json>'
      expect: []
    - input: '<a2ui-json>{"version":"v1.0","updateDataModel":{"surfaceId":"s1","path":"/x","value":1}}'
      expect:
        - components: []
          dataModelDelta: { path: /x, value: 1 }
    - input: '</a2ui-json>'
      expect: []

- name: test_content_unchanged_not_reyielded
  description: 相同内容重复下发时不重新 yield（组件粒度去重）。
  action: process_chunk
  steps:
    - input: '<a2ui-json>{"version":"v1.0","updateComponents":{"surfaceId":"s1","components":[{"id":"root","component":"Row","children":["a"]},{"id":"a","component":"Text","text":"x"}]}}'
      expect:
        - components:
            - { id: root, type: Row }
            - { id: a, type: Text }
    - input: '</a2ui-json>'
      expect: []
    - input: '<a2ui-json>{"version":"v1.0","updateComponents":{"surfaceId":"s1","components":[{"id":"root","component":"Row","children":["a"]},{"id":"a","component":"Text","text":"x"}]}}'
      expect: []
    - input: '</a2ui-json>'
      expect: []
