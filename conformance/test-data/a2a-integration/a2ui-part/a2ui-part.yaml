- name: test_create_a2ui_part
  description: 创建 A2UI part
  action: create_a2ui_part
  args:
    data: { 'foo': 'bar' }
    version: '1.0'
  expect:
    mime_type: 'application/a2ui+json'

- name: test_is_a2ui_part_positive
  description: 有效 A2UI part 识别
  action: is_a2ui_part
  args:
    mime_type: 'application/a2ui+json'
  expect: true

- name: test_is_a2ui_part_negative
  description: 非 A2UI part 识别
  action: is_a2ui_part
  args:
    mime_type: 'application/json'
  expect: false

- name: test_create_a2ui_part_legacy_default
  description: 旧版 MIME 类型识别（application/json+a2ui）
  action: create_a2ui_part
  args:
    data: { 'foo': 'bar' }
  expect:
    mime_type: 'application/json+a2ui'

- name: test_is_a2ui_part_legacy
  description: 旧版 MIME 类型正向识别
  action: is_a2ui_part
  args:
    mime_type: 'application/json+a2ui'
  expect: true
